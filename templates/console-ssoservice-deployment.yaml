apiVersion: v1
kind: Service
metadata:
  {{- include "imaging.metadata" (dict "ctx" $ "kind" "service" "component" "console-sso-service" "field" "annotations" "indent" 2 "block" true) }}
  labels:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "service" "component" "console-sso-service" "field" "labels" "indent" 4) }}
    app: castimaging
    imaging.group: console
    imaging.service: console-sso-service
  name: console-sso-service
  namespace: {{ .Release.Namespace }}  
spec:
  ports:
    - name: "8096"
      port: 8096
      targetPort: 8080
  selector:
    imaging.service: console-sso-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "imaging.metadata" (dict "ctx" $ "kind" "deployment" "component" "console-sso-service" "field" "annotations" "indent" 2 "block" true) }}
  labels:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "deployment" "component" "console-sso-service" "field" "labels" "indent" 4) }}
    app: castimaging
    imaging.group: console
    imaging.service: console-sso-service
    version: {{ .Values.ConsoleSSOServiceImage.tag | default .Values.version }}
  name: console-sso-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.SSOServiceReplicaCount }}
  selector:
    matchLabels:
      imaging.service: console-sso-service
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- include "imaging.metadata" (dict "ctx" $ "kind" "deployment" "component" "console-sso-service" "field" "annotations" "indent" 8) }}
        sidecar.istio.io/inject: "false"
      labels:
        {{- include "imaging.metadata" (dict "ctx" $ "kind" "deployment" "component" "console-sso-service" "field" "labels" "indent" 8) }}
        console.network/aip-network: "true"
        app: castimaging
        imaging.group: console
        imaging.service: console-sso-service
    spec:
{{- include "imaging.podSecurityContext" (dict "ctx" $ "component" "console-sso-service" "indent" 6) }}
{{- include "imaging.priorityClassName" (dict "ctx" $ "component" "console-sso-service" "indent" 6) }}
{{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupConsole | nindent 12 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorServicePostgresAnalysisNode | nindent 12 }}
            {{- toYaml .Values.labelSelectorGroupViewer | nindent 12 }}
{{- end }}
{{- if .Values.EnforceBalancedAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupViewer | nindent 12 }}
{{- end }}
      initContainers:
{{- if .Values.ReadOnlyRootFilesystem }}
        # Read-only root filesystem: copy /opt/keycloak (written at startup) to a writable emptyDir
        - name: init-folders
          image: "{{ .Values.ConsoleSSOServiceImage.name }}:{{ .Values.ConsoleSSOServiceImage.tag }}"
          imagePullPolicy: "{{ .Values.ConsoleSSOServiceImage.pullPolicy }}"
          command:
          - /bin/sh
          - -c
          - |
            rm -rf /keycloak-volume/*
            cp -r /opt/keycloak/* /keycloak-volume/ || true
          volumeMounts:
            - name: keycloak-dir
              mountPath: /keycloak-volume
{{- include "imaging.containerSecurityContext" (dict "ctx" $ "component" "console-sso-service" "indent" 10) }}
          resources:
            {{- toYaml .Values.InitContainerResources | nindent 12 }}
{{- end }}
        - name: wait-for-postgres
          image: {{ .Values.InitUtilImage.name }}:{{ .Values.InitUtilImage.tag }}
{{- include "imaging.containerSecurityContext" (dict "ctx" $ "component" "console-sso-service" "indent" 10) }}
          imagePullPolicy: "{{ .Values.InitUtilImage.pullPolicy }}"
          command:
          - /bin/sh
          - -c
          - |
{{- if .Values.CustomPostgres.enable }}
            until pg_isready -h {{ .Values.CustomPostgres.host }} -p {{ .Values.CustomPostgres.port }}; do echo waiting for postgres...; sleep 2; done; echo postgres is ready!
{{- else }}
            until pg_isready -h console-postgres -p 2285; do echo waiting for postgres...; sleep 2; done; echo postgres is ready!
{{- end }}
      containers:
        - env:
{{- range $key, $value := .Values.SSOSERVICE }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- if .Values.CustomPostgres.enable }}
            - name: KC_DB_URL
              value: jdbc:postgresql://{{ .Values.CustomPostgres.host }}:{{ .Values.CustomPostgres.port }}/{{ .Values.KEYCLOAK_DB }}
{{- else }}
            - name: KC_DB_URL
              value: jdbc:postgresql://console-postgres:2285/{{ .Values.KEYCLOAK_DB }}
{{- end }} 
            - name: KC_DB_SCHEMA
              value: {{ .Values.KEYCLOAK_SCHEMA | quote }}
            - name: KC_DB_USERNAME
              value: operator
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
                  key: operator-db-password
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
                  key: keycloak-admin-password
            - name: KC_PROXY 
              value: "edge"
            - name: PROXY_ADDRESS_FORWARDING
              value: "true"             
{{- if .Values.ContextUrl.enable }}
            - name: KC_HOSTNAME
              value: {{ .Values.FrontEndHost }}{{ .Values.ContextUrl.appcontext }}/auth
            - name: KC_HOSTNAME_ADMIN
              value: {{ .Values.FrontEndHost }}{{ .Values.ContextUrl.appcontext }}/auth
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: PUBLIC_URL
              value: {{ .Values.FrontEndHost }}{{ .Values.ContextUrl.appcontext }}
{{- else }}
            - name: KC_HOSTNAME
              value: {{ .Values.FrontEndHost }}/auth
            - name: KC_HOSTNAME_ADMIN
              value: {{ .Values.FrontEndHost }}/auth
            - name: KC_PROXY_HEADERS
              value: "forwarded"
            - name: PUBLIC_URL
              value: {{ .Values.FrontEndHost }}
{{- end }}
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: ACTIVEMQ_BROKER_URL
              value: tcp://console-control-panel:2381
            - name: KC_LOG
              value: console,file
            - name: KC_LOG_FILE
              value: /opt/cast/imaging-services/logs/sso/sso.log
            - name: KC_LOG_FILE_ROTATION_FILE_SUFFIX
              value: .yyyy-MM-dd.gz
            - name: KC_LOG_FILE_ROTATION_MAX_FILE_SIZE
              value: 10M
            - name: KC_LOG_FILE_ROTATION_ROTATE_ON_BOOT
              value: "false"
          image: "{{ .Values.ConsoleSSOServiceImage.name }}:{{ .Values.ConsoleSSOServiceImage.tag}}"
{{- include "imaging.containerSecurityContext" (dict "ctx" $ "component" "console-sso-service" "indent" 10) }}
          imagePullPolicy: "{{ .Values.ConsoleSSOServiceImage.pullPolicy }}"
          name: console-sso-service
          startupProbe:
            httpGet:
              path: /auth/health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /auth/health/ready
              port: 9000
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
            successThreshold: 1
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.SSOServiceResources | nindent 12 }}
          volumeMounts:
            - mountPath: /opt/cast/imaging-services/logs/sso
              name: ssoservice-logs
{{- if .Values.ReadOnlyRootFilesystem }}
            - name: keycloak-dir
              mountPath: /opt/keycloak
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
{{- end }}
      restartPolicy: Always
      volumes:
        - name: ssoservice-logs
          persistentVolumeClaim:
            claimName: pvc-ssoservice-logs
{{- if .Values.ReadOnlyRootFilesystem }}
        - name: keycloak-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
{{- end }}
{{- if .Values.ServiceAccountName }}
      serviceAccountName: {{ .Values.ServiceAccountName }}
{{- end }}
{{- if .Values.UseImagePullSecrets }}       
      imagePullSecrets:
        - name: imagepull-sec  
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  {{- include "imaging.metadata" (dict "ctx" $ "kind" "job" "component" "console-sso-service" "field" "annotations" "indent" 2 "block" true) }}
  {{- include "imaging.metadata" (dict "ctx" $ "kind" "job" "component" "console-sso-service" "field" "labels" "indent" 2 "block" true) }}
  name: keycloak-init-job-{{ include "imaging.jobSuffix" (list . "console-ssoservice-configmap.yaml" "init-keycloak.sh") }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 3  # init-keycloak.sh is idempotent: retry transient failures (e.g. DB restarting)
  template:
    metadata:
      {{- include "imaging.metadata" (dict "ctx" $ "kind" "job" "component" "console-sso-service" "field" "labels" "indent" 6 "block" true) }}
      annotations:
        {{- include "imaging.metadata" (dict "ctx" $ "kind" "job" "component" "console-sso-service" "field" "annotations" "indent" 8) }}
        sidecar.istio.io/inject: "false"
    spec:
{{- include "imaging.podSecurityContext" (dict "ctx" $ "component" "console-sso-service" "restricted" true "indent" 6) }}
{{- include "imaging.priorityClassName" (dict "ctx" $ "component" "console-sso-service" "indent" 6) }}
      restartPolicy: Never
{{- if .Values.ServiceAccountName }}
      serviceAccountName: {{ .Values.ServiceAccountName }}
{{- end }}
{{- if .Values.UseImagePullSecrets }}
      imagePullSecrets:
        - name: imagepull-sec
{{- end }}
      containers:
        - name: keycloak-init
          image: "{{ .Values.InitUtilImage.name }}:{{ .Values.InitUtilImage.tag}}"
          env:
            - name: KC_INTERNAL_URL
              value: http://console-sso-service:8096/auth
            - name: KC_USER
              value: "admin"
            - name: KC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
                  key: keycloak-admin-password
            - name: KCADMIN_USERNAME
              value: "{{ .Values.KCADMIN_USERNAME }}"
            - name: KCADMIN_PASSWORD
              value: "admin"
          command: ["sh", "-c", "/init-keycloak.sh"]
          volumeMounts:
            - name: keycloak-init-script
              mountPath: "/init-keycloak.sh"               
              subPath: init-keycloak.sh
{{- include "imaging.containerSecurityContext" (dict "ctx" $ "component" "console-sso-service" "restricted" true "indent" 10) }}
          resources:
            {{- toYaml .Values.InitContainerResources | nindent 12 }}
      volumes:
        - name: keycloak-init-script
          configMap:
            name: keycloak-init-script
            defaultMode: 0775