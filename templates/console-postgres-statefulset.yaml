{{- if .Values.CastStorageService.enable }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: castimaging
    imaging.service: console-postgres
  name: console-postgres
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: "2285"
      port: 2285
      targetPort: 5432
  selector:
    imaging.service: console-postgres
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-job
  namespace: {{ .Release.Namespace }}
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
  {{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
  {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never  
      containers:
        - name: postgres-init
          image: "{{ .Values.ConsolePostgresImage.name }}:{{ .Values.ConsolePostgresImage.tag}}"
          env:
            - name: PGHOST
              value: "console-postgres"
            - name: PGPORT
              value: "2285"
            - name: PGUSER
              value: "postgres"
            - name: PGDATABASE
              value: "postgres"
          command: ["/bin/bash", "-c", "/tmp/init-db.sh"]
          volumeMounts:
            - name: pginit
              mountPath: "/tmp/init-db.sh"               
              subPath: init-db.sh
            - name: db-creds
              mountPath: /opt/secrets
              readOnly: true 
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: pginit
          configMap:
            name: console-v3-init-db
            defaultMode: 0775
        - name: db-creds
          secret:
            secretName: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: castimaging
    imaging.service: console-postgres
  name: console-postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.ConsolePostgresReplicaCount }}
  serviceName: console-postgres
  selector:
    matchLabels:
      imaging.service: console-postgres
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        console.network/aip-network: "true"
        app: castimaging
        imaging.service: console-postgres
    spec:
      terminationGracePeriodSeconds: 120
  {{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorAppcastimaging | nindent 12 }}
  {{- end }}
  {{- if .Values.EnforceBalancedAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupViewer | nindent 12 }}
  {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
  {{- if .Values.CastStorageService.ssl }}
      initContainers:
        - name: generate-ssl-cert
          image: "{{ .Values.ConsolePostgresImage.name }}:{{ .Values.ConsolePostgresImage.tag }}"
          imagePullPolicy: "{{ .Values.ConsolePostgresImage.pullPolicy }}"
          command:
            - bash
            - -c
            - |
              umask 177
              openssl genrsa -out /var/lib/postgresql/ssl/server.key 2048
              umask 133
              openssl req -new -x509 -days 3650 -nodes \
                -key /var/lib/postgresql/ssl/server.key \
                -subj "/CN=console-postgres" \
                -out /var/lib/postgresql/ssl/server.crt
          volumeMounts:
            - name: postgres-ssl
              mountPath: /var/lib/postgresql/ssl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.InitContainerResources | nindent 12 }}
  {{- end }}
      containers:
        - env:
            - name: POSTGRESQL_USER
              value: postgres
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
                  key: postgres-db-password 
            - name: POSTGRESQL_DATABASE
              value: postgres
          image: "{{ .Values.ConsolePostgresImage.name }}:{{ .Values.ConsolePostgresImage.tag}}"
          imagePullPolicy: "IfNotPresent"
          livenessProbe:
            exec:
              command: 
                - /usr/libexec/check-container
                - --live
            failureThreshold: 5
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
          name: console-postgres
          ports:
            - containerPort: 5432
              protocol: TCP
          resources:
            {{- toYaml .Values.ConsolePostgresResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/lib/pgsql/data
              name: db-data
            - name: pgconf
              mountPath: "/opt/app-root/src/postgresql-cfg/postgresql.conf"
              subPath: postgresql.conf.sample
            - name: dshm
              mountPath: /dev/shm
  {{- if .Values.CastStorageService.ssl }}
            - name: postgres-ssl
              mountPath: /var/lib/postgresql/ssl
              readOnly: true
            - name: pghbaconf
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
  {{- end }}
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
        - name: pgconf
          configMap:
            name: console-v3-postgresqlconf
            defaultMode: 0644
        - name: pginit
          configMap:
            name: console-v3-init-db
            defaultMode: 0755
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres_shmsize }}
  {{- if .Values.CastStorageService.ssl }}
        - name: postgres-ssl
          emptyDir: {}
        - name: pghbaconf
          configMap:
            name: console-v3-pghbaconf
  {{- end }}
{{- end }}
---
{{- if .Values.CustomPostgres.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: custom-postgres-init-job
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
  {{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
  {{- end }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-init
          image: "{{ .Values.InitUtilImage.name }}:{{ .Values.InitUtilImage.tag}}"
          env:
            - name: PGHOST
              value: "{{ .Values.CustomPostgres.host }}"
            - name: PGPORT
              value: "{{ .Values.CustomPostgres.port }}"             
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
          command: ["/bin/bash", "-c", "/tmp/init-db-custom-pg.sh"]
          volumeMounts:
            - name: init-db-custom-pg
              mountPath: "/tmp/init-db-custom-pg.sh"               
              subPath: init-db-custom-pg.sh 
            - name: db-creds
              mountPath: /opt/secrets
              readOnly: true 
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: init-db-custom-pg
          configMap:
            name: init-db-custom-pg
            defaultMode: 0775
        - name: db-creds
          secret:
            secretName: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
{{- end }}