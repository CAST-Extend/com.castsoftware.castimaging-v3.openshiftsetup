{{- if .Values.Routes.enable }}
# Main application route — sends everything to console-gateway-service
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  {{- include "imaging.metadata" (dict "ctx" $ "kind" "route" "component" "console-gateway-service" "field" "labels" "indent" 2 "block" true) }}
  name: castimaging-route
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "route" "component" "console-gateway-service" "field" "annotations" "indent" 4) }}
    # Max duration of a request before the router aborts it with a Gateway Timeout (504)
    haproxy.router.openshift.io/timeout: {{ .Values.NetworkTimeoutSeconds }}s
  {{- if .Values.ContextUrl.enable }}
    # Rewrite path: /context/something -> /something
    haproxy.router.openshift.io/rewrite-target: /
    # Set X-Forwarded-Prefix so Spring Boot knows the context path
    haproxy.router.openshift.io/set-header: "X-Forwarded-Prefix {{ .Values.ContextUrl.appcontext }}"
  {{- end }}
spec:
  host: {{ (urlParse .Values.FrontEndHost).host }}
  {{- if .Values.ContextUrl.enable }}
  path: {{ .Values.ContextUrl.appcontext }}
  {{- else }}
  path: /
  {{- end }}
  to:
    kind: Service
    name: console-gateway-service
    weight: 100
  port:
    targetPort: '8090'
  {{- if .Values.Routes.tls }}
  tls:
    termination: edge
    certificate: {{ .Values.tls.certificate | quote }}
    key: {{ .Values.tls.key | quote }}
    insecureEdgeTerminationPolicy: None
  {{- end }}
  wildcardPolicy: None
---
  {{- if .Values.ExtendProxy.enable }}
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  {{- include "imaging.metadata" (dict "ctx" $ "kind" "route" "component" "extendproxy" "field" "labels" "indent" 2 "block" true) }}
  name: extendproxy-route
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "route" "component" "extendproxy" "field" "annotations" "indent" 4) }}
    haproxy.router.openshift.io/timeout: {{ .Values.ExtendProxy.timeoutSeconds }}s
spec:
  host: {{ .Values.ExtendProxy.exthostname }}
  path: /
  to:
    kind: Service
    name: extendproxy
    weight: 100
  port:
    targetPort: '8085'
    {{- if .Values.Routes.tls }}
  tls:
    termination: edge
    certificate: {{ .Values.tls.certificate | quote }}
    key: {{ .Values.tls.key | quote }}
    insecureEdgeTerminationPolicy: None
    {{- end }}
  wildcardPolicy: None
  {{- end }}
{{- end }}