{{- if .Values.CastStorageService.enable }}
apiVersion: v1
data:
  postgresql.conf.sample: |
    # -----------------------------
    # PostgreSQL configuration file
    # -----------------------------
    
    #------------------------------------------------------------------------------
    # FILE LOCATIONS
    #------------------------------------------------------------------------------
    
    #------------------------------------------------------------------------------
    # CONNECTIONS AND AUTHENTICATION
    #------------------------------------------------------------------------------
    
    listen_addresses = '*'
    max_connections = 300
    
    #------------------------------------------------------------------------------
    # RESOURCE USAGE (except WAL)
    #------------------------------------------------------------------------------
    
    shared_buffers = 2GB
    temp_buffers = 32MB
    work_mem = 64MB
    maintenance_work_mem = 512MB
    effective_cache_size = 6GB
    
    #------------------------------------------------------------------------------
    # WRITE-AHEAD LOG
    #------------------------------------------------------------------------------
    
    fsync = off
    synchronous_commit = off
    full_page_writes = off
    commit_delay = 10
    checkpoint_completion_target = 0.9
    max_wal_size = 4GB
    min_wal_size = 1GB
    
    #------------------------------------------------------------------------------
    # QUERY TUNING
    #------------------------------------------------------------------------------
    
    cursor_tuple_fraction = 1.0
    jit = off
    
    #------------------------------------------------------------------------------
    # REPORTING AND LOGGING
    #------------------------------------------------------------------------------
    
    log_destination = 'stderr'
    logging_collector = on
    log_checkpoints = on
    log_line_prefix = '%t [%p]: [%l-1] '
    log_temp_files = 1024kB
    
    #------------------------------------------------------------------------------
    # AUTOVACUUM
    #------------------------------------------------------------------------------
    
    autovacuum_vacuum_cost_limit = 200
    
    #------------------------------------------------------------------------------
    # CLIENT CONNECTION DEFAULTS
    #------------------------------------------------------------------------------
    
    bytea_output = 'escape'
    standard_conforming_strings = on
    
    #------------------------------------------------------------------------------
    # LOCK MANAGEMENT
    #------------------------------------------------------------------------------
    
    max_locks_per_transaction = 4096
    
    #------------------------------------------------------------------------------
    # CUSTOMIZED OPTIONS
    #------------------------------------------------------------------------------
    
    auto_explain.log_min_duration = '60s'
    auto_explain.log_nested_statements = on
    auto_explain.log_verbose = on
    auto_explain.log_buffers = on
    auto_explain.log_analyze = on
    shared_preload_libraries = 'auto_explain'

  {{- if .Values.CastStorageService.ssl }}
    # SSL
    ssl = on
    ssl_cert_file = '/var/lib/postgresql/ssl/server.crt'
    ssl_key_file  = '/var/lib/postgresql/ssl/server.key'
    ssl_min_protocol_version = 'TLSv1.2'
    ssl_prefer_server_ciphers = on
    hba_file = '/etc/postgresql/pg_hba.conf'
  {{- end }}

kind: ConfigMap
metadata:
  name: console-v3-postgresqlconf
  namespace: {{ .Release.Namespace }}
---
  {{- if .Values.CastStorageService.ssl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-v3-pghbaconf
  namespace: {{ .Release.Namespace }}
data:
  pg_hba.conf: |
    # TYPE  DATABASE    USER  ADDRESS          METHOD
    # Unix socket – used by pg_isready probes and init scripts
    local   all         all                    trust
    # Loopback – no SSL needed (intra-pod)
    host    all         all   127.0.0.1/32     scram-sha-256
    host    all         all   ::1/128          scram-sha-256
    # All remote TCP connections: SSL mandatory
    hostssl all         all   0.0.0.0/0        scram-sha-256
    hostssl all         all   ::0/0            scram-sha-256
    # Replication
    local   replication all                    trust
    host    replication all   127.0.0.1/32     scram-sha-256
    host    replication all   ::1/128          scram-sha-256
---
  {{- end }}
apiVersion: v1
data:
  init-db.sh: |
    #!/bin/bash

    set -e

    export OPERATOR_PASSWORD=$(cat /opt/secrets/operator-db-password )
    export GUEST_PASSWORD=$(cat /opt/secrets/guest-db-password)
    export KEYCLOAK_PASSWORD=$(cat /opt/secrets/keycloak-db-password)     
    export PGPASSWORD=$(cat /opt/secrets/postgres-db-password )

    echo $PGPASSWORD $KEYCLOAK_PASSWORD $GUEST_PASSWORD $OPERATOR_PASSWORD
    echo "Waiting for PostgreSQL to be ready..."
    until pg_isready -h $PGHOST -p $PGPORT -U $PGUSER; do
      echo "PostgreSQL is not ready yet, waiting..."
      sleep 1
    done
    
    echo "PostgreSQL is ready, running initialization..."
    psql -v ON_ERROR_STOP=1 -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE <<-EOSQL
      -- Create users only if they don't exist
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'operator') THEN
          CREATE USER operator WITH SUPERUSER PASSWORD '$OPERATOR_PASSWORD';
        END IF;
        
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'guest') THEN
          CREATE USER guest WITH PASSWORD '$GUEST_PASSWORD';
        END IF;
        
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'keycloak') THEN
          CREATE USER keycloak WITH PASSWORD '$KEYCLOAK_PASSWORD';
        END IF;
      END
      \$\$;

      -- Grant privileges (idempotent operation)
      GRANT ALL PRIVILEGES ON DATABASE postgres TO operator;

      -- Create database only if it doesn't exist
      SELECT 'CREATE DATABASE keycloak'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec

      -- Grant privileges on keycloak database
      GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
    EOSQL
    echo "Database initialization completed successfully!"

kind: ConfigMap
metadata:
  name: console-v3-init-db   
  namespace: {{ .Release.Namespace }}
{{- end }}
---
{{- if .Values.CustomPostgres.enable }}
apiVersion: v1
data:
  init-db-custom-pg.sh: |
    #!/bin/bash
    set -e

    export OPERATOR_PASSWORD=$(cat /opt/secrets/operator-db-password )
    export GUEST_PASSWORD=$(cat /opt/secrets/guest-db-password)
    export KEYCLOAK_PASSWORD=$(cat /opt/secrets/keycloak-db-password)     
    export PGPASSWORD=$(cat /opt/secrets/postgres-db-password )

    echo "Waiting for PostgreSQL to be ready..."
    until pg_isready -h $PGHOST -p $PGPORT -U $POSTGRES_USER; do
      echo "PostgreSQL is not ready yet, waiting..."
      sleep 1
    done
    echo "PostgreSQL is ready, running initialization..."
    psql -v ON_ERROR_STOP=1 -h $PGHOST -p $PGPORT -U $POSTGRES_USER -d $POSTGRES_DB <<-EOSQL
      -- Create users only if they don't exist
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'operator') THEN
          CREATE USER operator WITH PASSWORD '$OPERATOR_PASSWORD';
        END IF;
        
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'guest') THEN
          CREATE USER guest WITH PASSWORD '$GUEST_PASSWORD';
        END IF;
        
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'keycloak') THEN
          CREATE USER keycloak WITH PASSWORD '$KEYCLOAK_PASSWORD';
        END IF;
      END
      \$\$;

      -- Create databases
      SELECT 'CREATE DATABASE postgres'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$POSTGRES_DB')\gexec

      SELECT 'CREATE DATABASE keycloak'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec

      -- Grant privileges
      GRANT ALL PRIVILEGES ON DATABASE postgres TO operator;
      GRANT ALL PRIVILEGES ON DATABASE keycloak TO operator;
      GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
    EOSQL
    echo "Exiting database initialization script."

kind: ConfigMap
metadata:
  name: init-db-custom-pg   
  namespace: {{ .Release.Namespace }}
{{- end }}