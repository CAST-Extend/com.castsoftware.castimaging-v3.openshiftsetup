{{- if .Values.ExtendProxy.enable }}
apiVersion: v1
kind: Service
metadata:
  annotations:
  {{- if .Values.CreateLoadBalancer }}
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    app: castimaging
    imaging.group: console
    imaging.service: extendproxy
  name: extendproxy
  namespace: {{ .Release.Namespace }}  
spec:
  ports:
    - name: "8085"
      port: 8085
      targetPort: 8085
{{- if .Values.ExtendProxy.port }}
      nodePort: {{ .Values.ExtendProxy.port }}
{{- end }}
  selector:
    console.service: extendproxy
  {{- if .Values.CreateLoadBalancer }}
  type: LoadBalancer
  {{- else if .Values.ExtendProxy.port }}
  type: NodePort
  {{- end }}
---  
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: castimaging
    imaging.group: console
    imaging.service: extendproxy
    version: {{ .Values.ExtendProxyImage.tag| default .Values.version }}
  name: extendproxy
  namespace: {{ .Release.Namespace }}   
spec:
  replicas: {{ .Values.ExtendProxyReplicaCount }}
  selector:
    matchLabels:
      imaging.service: extendproxy
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        console.network/aip-network: "true"
        app: castimaging
        imaging.group: console
        imaging.service: extendproxy
        console.service: extendproxy
    spec:
  {{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorServiceSso | nindent 12 }}
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupConsole | nindent 12 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorGroupViewer | nindent 12 }}
  {{- end }}
  {{- if .Values.EnforceBalancedAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupViewer | nindent 12 }}
  {{- end }}
      containers:
        - env:
{{- range $key, $value := .Values.EXTENDPROXY }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
            - name: host_port
              value: "8085"
            - name: host_name
              value: "{{ .Values.ExtendProxy.exthostname }}"
            - name: ext_public_url
              value: "https://extend.castsoftware.com"
            - name: public_url
              value: "https://{{ .Values.ExtendProxy.exthostname }}"
            - name: platform
              value: "linux_x64"
          image: "{{ .Values.ExtendProxyImage.name }}:{{ .Values.ExtendProxyImage.tag}}"
          imagePullPolicy: "{{ .Values.ExtendProxyImage.pullPolicy }}"
          name: extendproxy
          ports:
            - containerPort: 8085
              protocol: TCP 
          resources:
            {{- toYaml .Values.ExtendProxyResources | nindent 12 }}
          volumeMounts:
            - name: extendproxy
              mountPath: /opt/cast_extend_proxy/data
      restartPolicy: Always
  {{- if .Values.UseImagePullSecrets }}       
      imagePullSecrets:
        - name: imagepull-sec   
  {{- end }}             
      volumes:
        - name: extendproxy
          persistentVolumeClaim:
            claimName: pvc-extendproxy-data
{{- end }}