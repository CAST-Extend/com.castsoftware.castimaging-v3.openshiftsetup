{{- if .Values.CreateStorageClass }}
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: crc-csi-hostpath-provisioner-delete
  annotations:
    storageclass.kubernetes.io/is-default-class: 'false'
    helm.sh/resource-policy: keep
provisioner: kubevirt.io.hostpath-provisioner
parameters:
  storagePool: local
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
{{- end }}  
---
{{- if .Values.AnalysisNodeFS.enable }}
# Placeholder for pv-shared-datadir filesystem PV
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-shared-datadir
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep  
  labels:
    console.service: console-analysis-node
spec:
  accessModes:
{{- if .Values.AnalysisNodeFS.enable }}
    - ReadWriteMany
  storageClassName: {{ .Values.FileClassName }}
{{- else }}
    - ReadWriteOnce
  storageClassName: {{ .Values.DiskClassName }}
{{- end }}  
  resources:
    requests:
      storage: {{ .Values.size_shared_datadir }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.size_db_data }}
  storageClassName: {{ .Values.DiskClassName }}
