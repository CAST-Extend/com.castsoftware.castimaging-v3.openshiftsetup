{{- if .Values.CreateStorageClass }}
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  {{- include "imaging.metadata" (dict "ctx" $ "kind" "storageClass" "component" "" "field" "labels" "indent" 2 "block" true) }}
  name: crc-csi-hostpath-provisioner-delete
  annotations:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "storageClass" "component" "" "field" "annotations" "indent" 4) }}
    storageclass.kubernetes.io/is-default-class: 'false'
    helm.sh/resource-policy: keep
provisioner: kubevirt.io.hostpath-provisioner
parameters:
  storagePool: local
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
{{- end }}  
---
{{- if .Values.AnalysisNodeFS.enable }}
# Placeholder for pv-shared-datadir filesystem PV
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-shared-datadir
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "pvc" "component" "console-analysis-node" "field" "annotations" "indent" 4) }}
    helm.sh/resource-policy: keep  
  labels:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "pvc" "component" "console-analysis-node" "field" "labels" "indent" 4) }}
    app: castimaging
    imaging.service: console-analysis-node
spec:
  accessModes:
    - {{ .Values.SharedVolumeAccessMode | default "ReadWriteMany" }}
  storageClassName: {{ .Values.FileClassName }}
  resources:
    requests:
      storage: {{ .Values.size_shared_datadir }}
---
{{- if .Values.CastStorageService.enable }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "pvc" "component" "console-postgres" "field" "annotations" "indent" 4) }}
    helm.sh/resource-policy: keep
  labels:
    {{- include "imaging.metadata" (dict "ctx" $ "kind" "pvc" "component" "console-postgres" "field" "labels" "indent" 4) }}
    app: castimaging
    imaging.service: console-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.size_db_data }}
  storageClassName: {{ .Values.DiskClassName }}
{{- end }}
